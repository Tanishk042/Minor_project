name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  jvm-tests:
    name: JVM unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ForestEarNode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Model assets (~60 MB) are committed, so no download step is needed.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: "Compile instrumented tests (not run: needs a device)"
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: ForestEarNode/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ForestEarNode/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
