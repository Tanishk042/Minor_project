name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System audio libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt

      - name: Run the test suite
        # Models and datasets are intentionally not committed. Tests that need
        # the YAMNet artifacts skip themselves when models_store/ is absent.
        run: python -m pytest -q

      - name: Report collection count
        if: always()
        run: python -m pytest --collect-only -q | tail -3
